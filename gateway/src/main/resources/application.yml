server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-and-orders
              uri: ${ORDER_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/orders/**
            - id: inventory
              uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/inventory/**
            - id: kitchen
              uri: ${NOTIFY_SERVICE_URI:http://localhost:8083}
              predicates:
                - Path=/api/kitchen/**

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

kitchenpulse:
  jwt:
    secret: ${JWT_SECRET:kitchenpulse-dev-only-change-me-32bytes-min}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
