server:
  port: ${SERVER_PORT:8082}

spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: inventory-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/kitchenpulse_inventory}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

kitchenpulse:
  jwt:
    secret: ${JWT_SECRET:kitchenpulse-dev-only-change-me-32bytes-min}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:4200}
