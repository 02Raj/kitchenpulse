# Copy to application-local.yml (gitignored) for local Postgres + Redpanda on the host.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kitchenpulse
    username: postgres
    password: YOUR_POSTGRES_PASSWORD
  kafka:
    bootstrap-servers: localhost:19092

kitchenpulse:
  jwt:
    secret: kitchenpulse-dev-only-change-me-32bytes-min
